__include__: [
  '../dataset/poly_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]


output_dir: ./output/rtdetrv2_r50vd_6x_poly


# Memory-optimized settings for single 16GB GPU
train_dataloader:
  total_batch_size: 4  # Reduced from 16 to 4 for single GPU
  num_workers: 4
  collate_fn:
    type: BatchImageCollateFunction
    scales: ~  # Disable multi-scale initially to save memory
    stop_epoch: 0

val_dataloader:
  total_batch_size: 8  # Reduced from 32 to 8


# Enable mixed precision training to save memory
use_amp: True


optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001
